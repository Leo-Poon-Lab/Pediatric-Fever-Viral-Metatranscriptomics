# config/config.yaml
# =============================================================================
# Elucidating Viral Pathogens in Pediatric Unexplained Fever Using Metatranscriptomics
# =============================================================================

# -----------------------------------------------------------------------------
# 1. PROJECT METADATA
# -----------------------------------------------------------------------------
project:
  name: "Pediatric_Unexplained_Fever_Metatranscriptomics"
  version: "1.0.0"
  description: "Metatranscriptomic analysis of viral pathogens in pediatric patients"
  author: "Zhang Tao"
  date: "2026-01-06"

# -----------------------------------------------------------------------------
# 2. INPUT/OUTPUT CONFIGURATION
# -----------------------------------------------------------------------------
io:
  # 样本信息文件路径
  samples_file: "config/samples.tsv"
  
  # 原始数据目录
  raw_data_dir: "data/raw"
  
  # 输出目录（会自动创建）
  output:
    base_dir: "results"
    preprocessing: "00_preprocessing"
    taxonomy: "01_taxonomy"
    assembly: "02_assembly"
    virus_id: "03_virus_identification"
    abundance: "04_abundance"
    annotation: "05_annotation"
    phylogeny: "06_phylogeny"
    reports: "reports"
    logs: "logs"

# -----------------------------------------------------------------------------
# 3. SAMPLE PROCESSING
# -----------------------------------------------------------------------------
samples:
  # 是否从samples.tsv文件读取样本
  use_samples_file: true
  
  # 如果不用文件，直接在这里列出样本
  # sample_list: ["sample1", "sample2", "sample3"]
  
  # 文件命名模式
  naming_pattern:
    R1: "{sample}_R1.fastq.gz"
    R2: "{sample}_R2.fastq.gz"

# -----------------------------------------------------------------------------
# 4. DATABASE PATHS (USER MUST CONFIGURE THESE!)
# -----------------------------------------------------------------------------
databases:
  nucleotide:
    nt: "/home/ubuntu/Tools/Blast/database/NT/nt/nt"
  protein: 
    nr: "/home/ubuntu/Tools/Diamond/nr_tax_full.dmnd"
  # ===== 人类参考基因组（宿主去除） =====
  human:    
    # BWA-MEM2索引（可以自动构建）
    bwa_index: "/home/ubuntu/ReferenceData/Human/BWA-Mem2_index/GCF_000001405.40_GRCh38.p14_genomic.fna"

  # ===== rRNA数据库（rRNA去除） =====
  rrna:
    # SortMeRNA数据库（推荐）
    sortmerna:
      archaea_5s: "/home/ubuntu/Tools/SortmeRNA/rRNA_databases/5SRNAdb_Archaea.fasta"
      bacteria_5s: "/home/ubuntu/Tools/SortmeRNA/rRNA_databases/5SRNAdb_Bacteria.fasta"
      eukaryota_5s: "/home/ubuntu/Tools/SortmeRNA/rRNA_databases/5SRNAdb_Eukaryota.fasta"
      lsu: "/home/ubuntu/Tools/SortmeRNA/rRNA_databases/SILVA_138.1_LSURef_tax_silva.fasta"
      ssu: "/home/ubuntu/Tools/SortmeRNA/rRNA_databases/SILVA_138.1_SSURef_tax_silva.fasta"
    
    bowtie2:
      rRNA_db: "/home/ubuntu/ReferenceData/rRNA/Bowtie2_index/rRNA_db"
    
    # 工作目录（临时文件）
    workdir: "/home/ubuntu/Tools/SortmeRNA"

  # ===== 病毒数据库（核心） =====
  viral:
    # NCBI RefSeq Viral
    refseq: "/path/to/viral/refseq_viral.fna"
    
    # RVDB（RNA病毒数据库）
    rvdb: "/path/to/viral/RVDB_v21.0.fasta"

  # ===== 分类学数据库 =====
  taxonomy:
    # Kraken2标准数据库
    kraken2uniq: 
      db: "/home/ubuntu/Tools/Kraken2/Database_PlusPF/"
    
    # Kaiju数据库
    kaiju:
      nodes: "/home/ubuntu/Tools/Kaiju/kaiju/kaijudb/rvdb/nodes.dmp"
      names: "/home/ubuntu/Tools/Kaiju/kaiju/kaijudb/rvdb/names.dmp"
      db: "/home/ubuntu/Tools/Kaiju/kaiju/kaijudb/rvdb/kaiju_db_rvdb.fmi"

      refseq_nodes: "/home/ubuntu/Tools/Kaiju/kaiju/kaijudb/refseq_nr/nodes.dmp"
      refseq_names: "/home/ubuntu/Tools/Kaiju/kaiju/kaijudb/refseq_nr/names.dmp"
      refseq_db: "/home/ubuntu/Tools/Kaiju/kaiju/kaijudb/refseq_nr/kaiju_db_refseq_nr.fmi"

    ictv: "/home/ubuntu/ReferenceData/ICTV_MS_39_v4.tsv"

  annotation:
    # eggNOG
    contamination: "/home/ubuntu/myMetagenomics/Trial/contamination_lab_known_taxID.txt"
    
    # KEGG
    kegg: "/path/to/kegg/kegg_db"
    
    # PFAM
    pfam: "/path/to/pfam/Pfam-A.hmm"
    
    # UniRef
    uniref: "/path/to/uniref/uniref90.fasta"

# -----------------------------------------------------------------------------
# 5. PREPROCESSING PARAMETERS
# -----------------------------------------------------------------------------
preprocessing:
  # 质量控制
  quality_control:
    min_quality: 20
    min_length: 36
    adapter_file: "resources/adapters/TruSeq3-PE-2.fa"
    
  # 宿主去除
  host_removal:
    enabled: true
    method: "bwa"  # 可选: "bwa", "bowtie2", "minimap2"
    threads: 16
    # 只有当比对质量低于此值时才保留（非宿主）
    min_mapq: 10
    
  # rRNA去除
  rrna_removal:
    enabled: true
    method: "sortmerna"  # 可选: "sortmerna", "barrnap", "bbduk"
    threads: 20
    coverage: 0.97

# -----------------------------------------------------------------------------
# 6. ASSEMBLY PARAMETERS
# -----------------------------------------------------------------------------
assembly:
  method: "trinity"  # 可选: "trinity", "spades", "megahit"
  
  trinity:
    min_contig_length: 200
    CPU: 32
    max_memory: "64G"
    
  spades:
    kmer: "21,33,55,77"
    only_assembler: true
    memory: 128
    
  megahit:
    kmin: 21
    kmax: 141
    kstep: 12

# -----------------------------------------------------------------------------
# 7. VIRUS IDENTIFICATION PARAMETERS
# -----------------------------------------------------------------------------
virus_identification:
  methods:
    - "blastn"
    - "diamond"
    - "virsorter2"
  
  blast:
    evalue: 1e-10
    percent_identity: 70
    max_target_seqs: 10
    
  diamond:
    evalue: 1e-10
    sensitivity: "sensitive"
    block_size: 2.0
    
  virsorter2:
    db: "viral"
    score: 0.5

# -----------------------------------------------------------------------------
# 8. ABUNDANCE CALCULATION
# -----------------------------------------------------------------------------
abundance:
  method: "salmon"  # 可选: "salmon", "kallisto", "featurecounts"
  
  salmon:
    libtype: "A"
    validateMappings: true
    gcBias: true
    
  kallisto:
    bootstrap: 30
    bias: true

# -----------------------------------------------------------------------------
# 9. RESOURCE ALLOCATION
# -----------------------------------------------------------------------------
resources:
  # 默认资源
  default:
    threads: 4
    memory: "8G"
    time: "04:00:00"
    
  # 各步骤资源分配
  fastqc:
    threads: 2
    memory: "2G"
    
  fastp:
    threads: 8
    memory: "4G"
    
  bwa:
    threads: 16
    memory: "32G"
    
  sortmerna:
    threads: 20
    memory: "64G"
    
  trinity:
    threads: 32
    memory: "128G"
    
  blast:
    threads: 8
    memory: "16G"
    
  diamond:
    threads: 16
    memory: "32G"

# -----------------------------------------------------------------------------
# 10. CLUSTER/SLURM CONFIGURATION (可选)
# -----------------------------------------------------------------------------
cluster:
  enabled: false
  scheduler: "slurm"  # 可选: "slurm", "sge", "lsf"
  
  slurm:
    account: "your_account"
    partition: "batch"
    time: "24:00:00"
    mem: "64G"
    mail_user: "your.email@example.com"
    mail_type: "FAIL"

# -----------------------------------------------------------------------------
# 11. ADVANCED SETTINGS
# -----------------------------------------------------------------------------
advanced:
  # 临时文件管理
  temp_dir: "temp"
  keep_temp_files: false
  
  # 并行处理
  max_jobs: 50
  latency_wait: 60
  
  # 日志
  log_level: "info"  # debug, info, warning, error
  
  # 重试失败作业
  restart_times: 3
  
  # Conda环境
  use_conda: true
  conda_frontend: "mamba"
  conda_prefix: "envs/.snakemake"